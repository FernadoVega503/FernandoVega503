<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registro de Contacto</title>
	<style>
		body{
			font-family: Arial, sans-serif;
			background-color: #DCB5FF;
			margin: 0;
			padding: 20px;
		}
		.container{
			max-width: 400px;
			margin: 0 auto;
			background: #fff;
			padding: 20px;
			border-radius: 8px;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
		}
		.form-group{
			margin-bottom: 15px;
		}
		.form-group label{
			display: block;
			margin-bottom: 5px;
		}
		.form-group input{
			width: 100%;
			padding: 8px;
			box-sizing: border-box;
		}
		.btn{
			background-color: #FF5151;
			color: #000079;
			border: none;
			padding: 10px;
			cursor: pointer;
			width: 100%;
			border-radius: 4px;
		}
		.btn: hover{
			background-color: #FFABAB;
		}
		.error{
			color: red;
			font-size: 0.9em;
		}
	</style>
</head>
<body>
	<div class="container">
		<center><img src="img/logo.jpeg" width="250" height="200"></center>
	<h2>REGISTRO DE CONTACTO</h2>
	<form id="registroForm">
		<div class="form-group">
			<label for="usuario">Usuario:</label>
			<input type="text" id="usuario" name="usuario">
			<span class="error" id="errorUsuario"></span>
		</div>
		<div class="form-group">
			<label for="nombre">Nombre:</label>
			<input type="text" id="nombre" name="nombre">
			<span class="error" id="errorNombre"></span>
		</div>
		<div class="form-group">
			<label for="email">Correo Electrónico:</label>
			<input type="email" id="email" name="email">
			<span class="error" id="errorEmail"></span>
		</div>
		<div class="form-group">
			<label for="password">Contraseña:</label>
			<input type="password" id="password" name="password">
			<span class="error" id="errorPassword"></span>			
		</div>
		<div class="form-group">
			<label for="teléfono">Teléfono:</label>
			<input type="text" id="teléfono" name="teléfono">
			<span class="error" id="errorTeléfono"></span>
		</div>
		<div class="form-group">
			<label for="dirección">Dirección:</label>
			<input type="text" id="dirección" name="dirección">
			<span class="error" id="errorDirección"></span>
		</div>
		<button type="button" class="btn" onclick="validarRegistro()">Registrarse:</button>
	</form>	
	</div>

	<script>
		function validarRegistro(){
			//Limpiar errores anteriores
			document.getElementById("errorNombre").textContent = "";
			document.getElementById("errorEmail").textContent = "";
			document.getElementById("errorPassword").textContent = "";

			//Obtener valores
			var nombre = document.getElementById("nombre").value;
			var email = document.getElementById("email").value;
			var password = document.getElementById("password").value;
			var esValido = true;

			//Validar nombre
			if (nombre === ""){
				document.getElementById("errorNombre").textContent = "El nombre es obligatorio";
				esValido = false;
			}

			//Validar email
			if (email === ""){
				document.getElementById("errorEmail").textContent = "El correo electrónico es obligatorio";
				esValido = false;
			} else if (!/^\S+@\S+\.\S+$/.test(email)) {
				document.getElementById("errorEmail").textContent = "El correo electrónico no es válido";
				esValido = false;
			}

			//Validar contraseña
			if (password === ""){
				document.getElementById("errorPassword").textContent = "La contraseña es obligatoria";
				esValido = false;
			} else if (password.length < 6){
				document.getElementById("errorPassword").textContent = "La contraseña debe tener al menos 6 caracteres";
				esValido = false;
			}

			// Si el formulario es válido, enviar los datos (aquí puedes implementar el envío de datos)
			if (esValido){
				alert("Registro enviado con éxito");
				// Aquí puedes añadir la lógica para enviar el registro , por ejemplo:
				// document.getElementById("registroForm").submit();
			}
		}
	</script>
</body>
</html>
